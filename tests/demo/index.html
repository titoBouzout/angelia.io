<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>angelia.io demo</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family:
					system-ui,
					-apple-system,
					sans-serif;

				--bg: #ffffff;
				--fg: #1a1a1a;
				--muted: #666;
				--subtle: #888;
				--border: #ddd;
				--panel: #fafafa;
				--chip-bg: #eee;
				--chip-fg: #333;
				--ok-bg: #cde9d2;
				--ok-fg: #1a4a25;
				--err-bg: #f3c9c9;
				--err-fg: #7a2222;
				--accent: #4477ff;
				--accent-hover: #3360e6;
				--whisper: #8a5cf2;
				--shout: #d97706;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #15171a;
					--fg: #e8e8e8;
					--muted: #aaa;
					--subtle: #888;
					--border: #333;
					--panel: #1d2024;
					--chip-bg: #2a2d31;
					--chip-fg: #ddd;
					--ok-bg: #1f3d29;
					--ok-fg: #b8e3c4;
					--err-bg: #4a2222;
					--err-fg: #ecb6b6;
					--accent: #6688ff;
					--accent-hover: #88a2ff;
					--whisper: #b48cff;
					--shout: #f5a44a;
				}
			}
			body {
				max-width: 720px;
				margin: 2rem auto;
				padding: 0 1rem 3rem;
				background: var(--bg);
				color: var(--fg);
			}
			h1 {
				margin: 0 0 0.25rem;
			}
			h2 {
				font-size: 0.85em;
				text-transform: uppercase;
				letter-spacing: 0.05em;
				color: var(--muted);
				margin: 1.25rem 0 0.5rem;
			}
			.sub {
				color: var(--muted);
				font-size: 0.9em;
				margin-bottom: 1rem;
				display: flex;
				gap: 0.5rem;
				align-items: center;
				flex-wrap: wrap;
			}
			.status {
				display: inline-block;
				padding: 0.1rem 0.5rem;
				border-radius: 999px;
				font-size: 0.85em;
				background: var(--chip-bg);
				color: var(--chip-fg);
			}
			.status.connected {
				background: var(--ok-bg);
				color: var(--ok-fg);
			}
			.status.offline {
				background: var(--err-bg);
				color: var(--err-fg);
			}
			.rtt {
				color: var(--subtle);
				font-size: 0.85em;
				font-variant-numeric: tabular-nums;
			}
			.log {
				border: 1px solid var(--border);
				border-radius: 6px;
				padding: 0.5rem 0.75rem;
				height: 280px;
				overflow-y: auto;
				margin: 0.5rem 0;
				background: var(--panel);
				color: var(--fg);
			}
			.line {
				padding: 0.15rem 0;
				word-break: break-word;
			}
			.line .from {
				color: var(--muted);
				font-weight: 600;
				margin-right: 0.4rem;
			}
			.line.system {
				color: var(--subtle);
				font-style: italic;
			}
			.line.ack {
				color: var(--subtle);
				font-size: 0.8em;
			}
			.line.whisper,
			.line.whisper .from {
				color: var(--whisper);
			}
			.line.shout,
			.line.shout .from {
				color: var(--shout);
			}
			form {
				display: flex;
				gap: 0.5rem;
				flex-wrap: wrap;
			}
			input[type='text'] {
				flex: 1;
				min-width: 12rem;
				padding: 0.5rem 0.65rem;
				border: 1px solid var(--border);
				border-radius: 6px;
				background: var(--bg);
				color: var(--fg);
				font: inherit;
			}
			input[type='text']::placeholder {
				color: var(--subtle);
			}
			button {
				padding: 0.5rem 0.9rem;
				border: 0;
				border-radius: 6px;
				background: var(--accent);
				color: white;
				font: inherit;
				cursor: pointer;
			}
			button:hover {
				background: var(--accent-hover);
			}
			button.secondary {
				background: var(--chip-bg);
				color: var(--chip-fg);
			}
			button.secondary:hover {
				background: var(--accent);
				color: white;
			}
			.typing {
				min-height: 1.2em;
				color: var(--subtle);
				font-size: 0.85em;
				margin-top: 0.25rem;
			}
			.roster {
				font-size: 0.85em;
				color: var(--muted);
				margin-top: 0.75rem;
			}
			.room-bar {
				align-items: center;
				margin: 0 0 0.5rem;
			}
			.room-bar .label {
				color: var(--subtle);
				font-size: 0.9em;
			}
			.room-bar strong {
				color: var(--accent);
				margin-right: 0.5rem;
			}
			.actions {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
				gap: 0.5rem;
			}
			.stats-grid {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
				gap: 0.75rem;
				margin-top: 0.75rem;
			}
			.stats-grid section {
				background: var(--panel);
				border: 1px solid var(--border);
				border-radius: 6px;
				padding: 0.5rem 0.75rem;
			}
			.stats-grid h3 {
				font-size: 0.8em;
				text-transform: uppercase;
				color: var(--muted);
				margin: 0 0 0.5rem;
				letter-spacing: 0.05em;
			}
			.stats-grid dl {
				display: grid;
				grid-template-columns: 1fr auto;
				gap: 0.15rem 0.75rem;
				margin: 0;
				font-size: 0.85em;
			}
			.stats-grid dt {
				color: var(--muted);
			}
			.stats-grid dd {
				margin: 0;
				font-variant-numeric: tabular-nums;
				text-align: right;
				word-break: break-all;
			}
			.stats-grid dd.ua {
				font-size: 0.75em;
				color: var(--subtle);
			}
			.room-list {
				list-style: none;
				padding: 0;
				margin: 0;
				font-size: 0.85em;
			}
			.room-list li {
				padding: 0.15rem 0;
				color: var(--muted);
				font-variant-numeric: tabular-nums;
			}
			.room-list .tag {
				display: inline-block;
				margin-left: 0.4rem;
				padding: 0 0.4rem;
				border-radius: 999px;
				background: var(--accent);
				color: white;
				font-size: 0.7em;
				vertical-align: middle;
			}
		</style>
		<script type="importmap">
			{
				"imports": {
					"pota": "/pota/src/exports.js",
					"pota/xml": "/pota/src/core/xml.js",
					"pota/components": "/pota/src/components/@main.js"
				}
			}
		</script>
		<script>
			window.__CERT_HASH = __CERT_HASH__
		</script>
		<script type="module" src="/main.js"></script>
	</head>
	<body></body>
</html>
